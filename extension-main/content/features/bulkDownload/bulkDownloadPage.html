<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scaler++ Bulk Download</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    [hidden] {
      display: none !important;
    }

    :root {
      --bg: #0f1117;
      --surface: #1c1d27;
      --surface-2: #18181b;
      --line: #27272a;
      --text: #e4e4e7;
      --text-dim: #a1a1aa;
      --text-faint: #71717a;
      --accent: #3484f0;
      --accent-2: #6366f1;
      --good: #10b981;
      --bad: #f43f5e;
      --warn: #f59e0b;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 24px 80px;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
    }

    .brand {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-dim);
      margin-bottom: 28px;
    }

    .brand span {
      color: var(--accent);
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
    }

    .subject {
      margin-top: 4px;
      color: var(--text-dim);
      font-size: 14px;
    }

    .card {
      margin-top: 24px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .summary {
      color: var(--text-dim);
      font-size: 14px;
    }

    .notice {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fcd34d;
      font-size: 13px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0;
    }

    button {
      padding: 11px 20px;
      border-radius: 10px;
      font: 700 14px/1 inherit;
      cursor: pointer;
    }

    .btn-primary {
      border: none;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .btn-ghost {
      border: 1px solid var(--line);
      color: var(--text-dim);
      background: var(--surface-2);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      font-weight: 600;
      color: var(--text-faint);
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #1f1f23;
      vertical-align: top;
    }

    td.num,
    td.when {
      color: var(--text-faint);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    td.status {
      min-width: 150px;
      color: var(--text-dim);
    }

    td.status.good {
      color: var(--good);
    }

    td.status.bad {
      color: var(--bad);
    }

    td.status.muted {
      color: var(--text-faint);
    }

    td.status.busy {
      color: var(--accent);
    }

    .logs {
      margin-top: 18px;
      max-height: 180px;
      overflow-y: auto;
      padding: 12px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--text-faint);
      white-space: pre-wrap;
    }

    .foot {
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-faint);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand">Scaler<span>++</span></div>
    <h1>Bulk download</h1>
    <p class="subject" id="subject"></p>

    <section class="card">
      <p class="summary" id="summary"></p>
      <div class="notice" id="notice" hidden></div>

      <div class="actions">
        <button class="btn-primary" id="start-btn">Choose a folder &amp; start</button>
        <button class="btn-ghost" id="cancel-btn" hidden>Cancel</button>
        <button class="btn-ghost" id="retry-btn" hidden>Retry failed</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr id="head-row">
              <th>#</th>
              <th>When</th>
              <th>Lecture</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div class="logs" id="logs" hidden></div>

      <p class="foot">
        Keep this tab open until everything finishes. Streams are fetched through the
        Scaler tab you started from, so keep that tab open on Scaler too.
      </p>
    </section>
  </div>

  <script src="../../../libs/jszip.min.js"></script>
  <script src="../videoDownloader/tsAudioExtractor.js"></script>
  <script src="../videoDownloader/hlsDownloadEngine.js"></script>
  <script src="../videoDownloader/transcriptHeader.js"></script>
  <script src="bulkJob.js"></script>
  <script src="bulkDownloadPage.js"></script>
</body>
</html>
